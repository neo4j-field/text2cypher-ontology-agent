[project]
name = "text2cypher-react-agent-example"
version = "0.1.0"
description = "A Text2Cypher ReAct agent built with LangGraph and the Neo4j Cypher MCP server."
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
    "ipykernel>=6.30.1",
    "langchain>=1.5.0",
    "langchain-mcp-adapters>=0.3.2",
    "langchain-openai>=1.7.4",
    "langgraph>=1.2.20",
    "neo4j>=6.4.1",
    "openai>=3.0.0",
    "pandas>=2.3.2",
    "pydantic>=2.11.7",
    "ragas>=0.4.3",
    "rouge-score>=0.1.2",
]

[dependency-groups]
dev = [
    "ruff>=0.12.8",
]

[tool.ruff]
line-length = 100
